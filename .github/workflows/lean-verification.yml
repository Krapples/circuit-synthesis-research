name: Lean research verification

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lean-verification.yml'
      - 'sat-search/chatgpt_handoff/lean/**'
      - 'sat-search/chatgpt_handoff/upstream/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-research-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_SHA: 3db0136bf094e975baaf20214b01e4b4579059f2
      LEAN_TOOLCHAIN: leanprover/lean4:v4.36.0
      MATHLIB_SHA: fc4f59e577feb1a4956671bc04ac18aaaf8cd842
      ELAN_VERSION: v4.4.0
      ELAN_SHA256: 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
      LAKE_ARTIFACT_CACHE: 'false'
    steps:
      - name: Checkout trusted research revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch exact upstream definitions and lockfile
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/pequalnp-upstream"
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/open-goat/pequalnp-proofs.git
          git -C "$upstream" fetch --depth=1 origin "$UPSTREAM_SHA"
          git -C "$upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(cat "$upstream/lean/lean-toolchain")" = "$LEAN_TOOLCHAIN"
          test -f "$upstream/lean/lake-manifest.json"
          jq -e --arg rev "$MATHLIB_SHA" '.packages[] | select(.name == "mathlib" and .rev == $rev)' "$upstream/lean/lake-manifest.json"
          echo "UPSTREAM_DIR=$upstream" >> "$GITHUB_ENV"

      - name: Install checksum-pinned Elan and Lean
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$RUNNER_TEMP/research-elan"
          sh "$UPSTREAM_DIR/.github/scripts/install-elan.sh" "$ELAN_VERSION" "$ELAN_SHA256" "$ELAN_HOME" "$LEAN_TOOLCHAIN"
          cd "$UPSTREAM_DIR/lean"
          tc="$(dirname "$("$ELAN_HOME/bin/elan" which lake)")"
          test -x "$tc/lean"
          test -x "$tc/lake"
          echo "$tc" >> "$GITHUB_PATH"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          "$tc/lean" --version

      - name: Restore pinned Mathlib and build definition modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$UPSTREAM_DIR/lean"
          # Avoid compiling the large collection of outside submissions.
          if [ -d PEqualNP/Outside ]; then
            mv PEqualNP/Outside "$RUNNER_TEMP/pequalnp-outside"
          fi
          lake exe cache get
          lake build +Mathlib +PEqualNP.Defs
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      - name: Check each research proof independently
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/sat-search/chatgpt_handoff/lean"
          test -f "$root/ProofSmoke.lean"
          cd "$UPSTREAM_DIR/lean"
          mkdir -p "$RUNNER_TEMP/lean-audits"
          count=0
          failures=0
          while IFS= read -r -d '' proof; do
            count=$((count + 1))
            echo "::group::Checking ${proof##*/}"
            if lake env lean -DwarningAsError=true "$proof" 2>&1 | tee "$RUNNER_TEMP/lean-audits/${proof##*/}.log"; then
              echo "CHECKED: ${proof##*/}"
            else
              echo "::error::Lean rejected ${proof##*/}"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done < <(find "$root" -type f -name '*.lean' -print0 | sort -z)
          test "$count" -gt 0
          echo "Checked $count files; $failures failed."
          test "$failures" -eq 0

      - name: Build pinned upstream lemmas and check one-junk bridge
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/sat-search/chatgpt_handoff/lean"
          bridge="$GITHUB_WORKSPACE/sat-search/chatgpt_handoff/upstream/OneJunkUpstream.lean"
          cd "$UPSTREAM_DIR/lean"
          # Restore only the five explicit outside modules. Their dependencies
          # live in the pinned definition/helper directories.
          mkdir -p PEqualNP/Outside
          for id in 4712 4743 4745 4746 4747; do
            cp "$RUNNER_TEMP/pequalnp-outside/L_meta_${id}.lean" PEqualNP/Outside/
            lake build "+PEqualNP.Outside.L_meta_${id}"
          done
          lake env lean --root="$root" -DwarningAsError=true -o .lake/build/lib/lean/OneJunkErase.olean "$root/OneJunkErase.lean"
          echo "::group::Checking OneJunkUpstream.lean"
          lake env lean -DwarningAsError=true "$bridge" 2>&1 | tee "$RUNNER_TEMP/lean-audits/OneJunkUpstream.lean.log"
          echo "CHECKED: OneJunkUpstream.lean"
          echo "::endgroup::"

      - name: Enforce reported axiom allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "sat-search/chatgpt_handoff"
          logs = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lean-audits"
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          sources = sorted((root / "lean").rglob("*.lean")) + [root / "upstream/OneJunkUpstream.lean"]
          results = []
          for source in sources:
              source_bytes = source.read_bytes()
              requested = re.findall(r"(?m)^\s*#print axioms\s+(\S+)\s*$", source_bytes.decode("utf-8"))
              log = (logs / (source.name + ".log")).read_text()
              reports = [(name, [a.strip() for a in axioms.split(",") if a.strip()])
                         for name, axioms in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", log)]
              reports += [(name, []) for name in re.findall(r"'([^']+)' does not depend on any axioms", log)]
              if not requested or len(reports) != len(requested):
                  raise SystemExit(f"{source.name}: expected {len(requested)} reports, received {len(reports)}")
              unmatched = list(reports)
              for decl in requested:
                  matches = [item for item in unmatched if item[0] == decl or item[0].endswith("." + decl)]
                  if len(matches) != 1:
                      raise SystemExit(f"{source.name}: missing or ambiguous axiom report for {decl}")
                  unmatched.remove(matches[0])
              for name, axioms in reports:
                  bad = set(axioms) - allowed
                  if bad:
                      raise SystemExit(f"{source.name}: {name} uses forbidden axioms {sorted(bad)}")
              results.append({"file": str(source.relative_to(root)), "sha256": hashlib.sha256(source_bytes).hexdigest(),
                              "reports": [{"name": n, "axioms": a} for n, a in reports]})
          (logs / "axioms.json").write_text(json.dumps(results, indent=2) + "\n")
          print(f"Audited {sum(len(r['reports']) for r in results)} declarations across {len(results)} files.")
          PY
