name = "circuitlemmas"
defaultTargets = ["CircuitLemmas"]

# Same Mathlib commit as pequalnp-proofs/lean (v4.36.0 release); .lake/packages is a junction to that
# project's built packages, so nothing is downloaded or rebuilt. Change both projects together or neither.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "CircuitLemmas"
